name: 构建 Windows 发行包并发布 Release

# 发布四类资产：devplatform-windows.zip（免 clone 绿色包）、devplatform.exe（自包含单文件）、
# devplatform-dist.zip（git clone 后安装器自动下载的组件包）、SHA256SUMS.txt。
# 触发：推送 v* tag（推荐），或在 Actions 页面手动运行（可指定 tag）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag（如 v0.2.0）；留空则取 platform/package.json 版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: 安装构建依赖
        working-directory: platform
        run: npm ci

      # build.mjs 会从当前 node.exe 动态提取 SEA sentinel，换 Node 小版本不会失败
      - name: 构建 dist（SEA 单文件 + 外置业务包）
        working-directory: platform
        run: npm run build

      - name: 打包可分发 zip（排除 .env / data / workspace）
        shell: pwsh
        run: |
          ./windows/pack-dist.ps1 -Root (Get-Location).Path -Output (Join-Path (Get-Location).Path 'devplatform-dist.zip')

      - name: 生成完整绿色包与独立 exe
        shell: pwsh
        run: |
          ./windows/pack-release.ps1 -Root (Get-Location).Path -OutputDir (Get-Location).Path

      - name: 计算发布 tag
        id: meta
        shell: pwsh
        run: |
          $t = '${{ inputs.tag }}'
          if (-not $t) { $t = '${{ github.ref_name }}' }
          if (-not $t -or $t -eq 'main' -or $t -eq 'master') {
            $t = 'v' + (Get-Content platform/package.json -Raw | ConvertFrom-Json).version
          }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 发布 / 更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $notes = @(
            "DevPlatform $tag · Windows 免安装发行包",
            '',
            '由 GitHub Actions 在 windows-latest 上执行 npm ci + npm run build 自动构建。',
            '',
            '【重要】START.bat 与 INSTALL.bat 不是一回事：',
            '  START.bat   只启动控制台（服务器 / SSH / 终端 / 文件 / AI / 构建）。',
            '              不会安装、也不会自动启动 Gitea / OpenList / 在线 IDE；',
            '              启动前会打印这三项的在线状态与本机服务是否已安装。',
            '  INSTALL.bat 额外安装并启动三项集成服务（无 Docker 自动改用 Windows 原生 exe），',
            '              首次需联网下载二进制，或把 exe 放进 windows\bin 走 -NoDownload 离线安装。',
            '',
            '下载哪个：',
            '  1) devplatform-windows.zip  推荐。解压后：只要控制台双击 START.bat；',
            '                              要集成服务再双击 INSTALL.bat（含顶层中文说明）。',
            '  2) devplatform.exe          自包含单文件，放任意空目录双击即用（只有控制台，无安装脚本）。',
            '  3) devplatform-dist.zip     组件包，供 git clone 后 windows\install.bat 自动下载。',
            '  4) SHA256SUMS.txt           以上三个文件的 SHA256 校验值。',
            '',
            '只跑 START.bat 时三项集成服务显示「未配置 / 离线」是预期行为，不是故障。',
            '全程不需要 git、Node.js、Docker 或 bash（只有 INSTALL.bat 装集成服务时才需联网）。',
            '校验：Get-FileHash <文件> -Algorithm SHA256，与 SHA256SUMS.txt 比对。',
            '',
            "Commit: $env:GITHUB_SHA"
          ) -join "`n"
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release view $tag | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            gh release upload $tag devplatform-dist.zip devplatform-windows.zip devplatform.exe SHA256SUMS.txt --clobber
          } else {
            $extra = @()
            if ('${{ github.event_name }}' -ne 'push') { $extra += @('--target', $env:GITHUB_SHA) }
            gh release create $tag devplatform-dist.zip devplatform-windows.zip devplatform.exe SHA256SUMS.txt --title "DevPlatform $tag" --notes-file release-notes.md @extra
          }
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败' }

      - name: 留存构建产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: devplatform-release
          path: |
            devplatform-dist.zip
            devplatform-windows.zip
            devplatform.exe
            SHA256SUMS.txt
